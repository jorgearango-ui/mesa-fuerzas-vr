<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mesa de Fuerzas VR</title>
   

    <style> #panel-control {
    position: absolute;
    top: 20px;
    right: 20px;
    background: rgba(20, 20, 40, 0.9);
    color: white;
    padding: 20px;
    border-radius: 12px;
    width: 280px;
    border: 1px solid rgba(255,255,255,0.1);
    z-index: 100;
    font-family: 'Segoe UI', sans-serif;
}

#panel-control h3 {
    margin: 0 0 15px 0;
    text-align: center;
    font-size: 16px;
    color: #4facfe;
}

.fuerza-control {
    background: rgba(255,255,255,0.05);
    padding: 10px;
    border-radius: 8px;
    margin-bottom: 10px;
}

.fuerza-control h4 {
    margin: 0 0 8px 0;
    font-size: 14px;
}

.slider-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 6px;
}

.slider-row .label {
    font-size: 11px;
    color: #a0aec0;
    width: 45px;
}

.slider-row input[type="range"] {
    flex: 1;
    height: 4px;
    -webkit-appearance: none;
    background: rgba(255,255,255,0.15);
    border-radius: 4px;
    outline: none;
}

.slider-row input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: #4facfe;
    cursor: pointer;
    border: 2px solid rgba(255,255,255,0.3);
}

.slider-row .valor {
    font-size: 12px;
    font-weight: 700;
    width: 45px;
    text-align: right;
    color: #4facfe;
    font-family: 'Courier New', monospace;
}

#estado {
    text-align: center;
    padding: 8px;
    border-radius: 8px;
    background: rgba(255,255,255,0.05);
    margin-top: 10px;
    font-size: 13px;
    font-weight: 600;
}

#estado.equilibrio {
    color: #68d391;
    border: 1px solid rgba(104, 211, 145, 0.3);
}

#estado.desequilibrio {
    color: #fc8181;
    border: 1px solid rgba(252, 129, 129, 0.3);
}
        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            background: rgba(0,0,0,0.6);
            padding: 10px;
            border-radius: 8px;
            z-index: 100;
        }
        #enter-vr {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 15px 30px;
            font-size: 18px;
            background: #4facfe;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            z-index: 100;
        }
        #enter-vr:hover {
            background: #3a8fd9;
        }
    </style>
</head>
<body>
    <div id="info">
        <h2>🔬 Mesa de Fuerzas VR</h2>
        <p>Usa los controles para interactuar</p>
    </div>
    <button id="enter-vr">Entrar en VR</button>
<div id="panel-control">
    <h3>🎮 Control de Fuerzas</h3>
    
    <!-- Fuerza 1 -->
    <div class="fuerza-control">
        <h4 style="color:#ff4444;">🔴 F1</h4>
        <div class="slider-row">
            <span class="label">Ángulo:</span>
            <input type="range" id="angulo1" min="0" max="360" value="30">
            <span class="valor" id="angulo1-valor">30°</span>
        </div>
        <div class="slider-row">
            <span class="label">Masa:</span>
            <input type="range" id="masa1" min="0" max="500" value="100">
            <span class="valor" id="masa1-valor">100g</span>
        </div>
    </div>
    
    <!-- Fuerza 2 -->
    <div class="fuerza-control">
        <h4 style="color:#44ff44;">🟢 F2</h4>
        <div class="slider-row">
            <span class="label">Ángulo:</span>
            <input type="range" id="angulo2" min="0" max="360" value="330">
            <span class="valor" id="angulo2-valor">330°</span>
        </div>
        <div class="slider-row">
            <span class="label">Masa:</span>
            <input type="range" id="masa2" min="0" max="500" value="100">
            <span class="valor" id="masa2-valor">100g</span>
        </div>
    </div>
    
    <!-- Fuerza 3 -->
    <div class="fuerza-control">
        <h4 style="color:#4444ff;">🔵 F3</h4>
        <div class="slider-row">
            <span class="label">Ángulo:</span>
            <input type="range" id="angulo3" min="0" max="360" value="180">
            <span class="valor" id="angulo3-valor">180°</span>
        </div>
        <div class="slider-row">
            <span class="label">Masa:</span>
            <input type="range" id="masa3" min="0" max="500" value="173">
            <span class="valor" id="masa3-valor">173g</span>
        </div>
    </div>
    
    <!-- Estado -->
    <div id="estado">
        <span id="estado-texto">❌ Desequilibrio</span>
    </div>
</div>
    <!-- Importar Three.js -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { VRButton } from 'three/addons/webxr/VRButton.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { XRControllerModelFactory } from 'three/addons/webxr/XRControllerModelFactory.js';

        // ============================================================
        // CONFIGURACIÓN BÁSICA
        // ============================================================
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a2e);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 2, 3);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.xr.enabled = true;
        document.body.appendChild(renderer.domElement);

        // Controles para PC (no VR)
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.target.set(0, 0, 0);
        controls.update();

        // ============================================================
        // ILUMINACIÓN
        // ============================================================
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 1);
        dirLight.position.set(5, 10, 7);
        scene.add(dirLight);

        // ============================================================
        // PISO
        // ============================================================
        const floorGeometry = new THREE.CircleGeometry(5, 32);
        const floorMaterial = new THREE.MeshStandardMaterial({ color: 0x333333 });
        const floor = new THREE.Mesh(floorGeometry, floorMaterial);
        floor.rotation.x = -Math.PI / 2;
        floor.position.y = -0.1;
        scene.add(floor);

       // ============================================================
// MESA DE FUERZAS (CILINDRO CON MARCAS DE ÁNGULOS)
// ============================================================

// 1. Crear la textura con las marcas de ángulos
function crearTexturaMesa() {
    const canvas = document.createElement('canvas');
    const size = 1024;
    canvas.width = size;
    canvas.height = size;
    const ctx = canvas.getContext('2d');
    
    // Fondo de la mesa
    ctx.fillStyle = '#e0e0e0';
    ctx.fillRect(0, 0, size, size);
    
    // ============================================================
    // CORRECCIÓN DE ORIENTACIÓN
    // ============================================================
    // Aplicamos una transformación al canvas para que las marcas
    // coincidan con las flechas 3D.
    // 1. Trasladamos al centro
    // 2. Rotamos -90° (sentido antihorario)
    // 3. Invertimos el eje Y (espejo vertical)
    // 4. Trasladamos de vuelta al centro
    // ============================================================
    ctx.save();
    ctx.translate(size / 2, size / 2);
    ctx.rotate(-Math.PI / 2); // Rotar 90° antihorario
    ctx.scale(1, -1);          // Invertir eje Y (espejo vertical)
    ctx.translate(-size / 2, -size / 2);
    
    const cx = size / 2;
    const cy = size / 2;
    const radioExterior = size / 2 - 20;
    const radioInterior = radioExterior - 40;
    
    // Círculo exterior
    ctx.beginPath();
    ctx.arc(cx, cy, radioExterior, 0, 2 * Math.PI);
    ctx.strokeStyle = '#333';
    ctx.lineWidth = 4;
    ctx.stroke();
    
    // Círculo interior
    ctx.beginPath();
    ctx.arc(cx, cy, radioInterior, 0, 2 * Math.PI);
    ctx.strokeStyle = '#333';
    ctx.lineWidth = 2;
    ctx.stroke();
    
    // Círculo central
    ctx.beginPath();
    ctx.arc(cx, cy, 40, 0, 2 * Math.PI);
    ctx.strokeStyle = '#333';
    ctx.lineWidth = 2;
    ctx.stroke();
    
    // Dibujar marcas de ángulos cada 10 grados
    for (let angulo = 0; angulo < 360; angulo += 10) {
        // 0° hacia la derecha (eje X positivo en Three.js)
        const rad = angulo * Math.PI / 180;
        
        const esPrincipal = angulo % 30 === 0;
        const largoMarca = esPrincipal ? 30 : 15;
        
        const x1 = cx + (radioExterior - largoMarca) * Math.cos(rad);
        const y1 = cy + (radioExterior - largoMarca) * Math.sin(rad);
        const x2 = cx + radioExterior * Math.cos(rad);
        const y2 = cy + radioExterior * Math.sin(rad);
        
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.strokeStyle = esPrincipal ? '#000' : '#555';
        ctx.lineWidth = esPrincipal ? 3 : 1;
        ctx.stroke();
        
        // Números para múltiplos de 30
        if (esPrincipal) {
            const radioTexto = radioExterior - 55;
            const xTexto = cx + radioTexto * Math.cos(rad);
            const yTexto = cy + radioTexto * Math.sin(rad);
            
            // Guardamos el estado antes de escribir el texto
            ctx.save();
            // Para que el texto no quede invertido, lo dibujamos sin la transformación
            // (aunque esté dentro del bloque transformado, el texto se lee bien)
            ctx.fillStyle = '#000';
            ctx.font = 'bold 22px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(angulo + '°', xTexto, yTexto);
            ctx.restore();
        }
    }
    
    // Líneas radiales principales (cada 90 grados)
    for (let angulo = 0; angulo < 360; angulo += 90) {
        const rad = angulo * Math.PI / 180;
        const x1 = cx + 40 * Math.cos(rad);
        const y1 = cy + 40 * Math.sin(rad);
        const x2 = cx + radioExterior * Math.cos(rad);
        const y2 = cy + radioExterior * Math.sin(rad);
        
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.strokeStyle = '#222';
        ctx.lineWidth = 2;
        ctx.stroke();
    }
    
    // Punto central
    ctx.beginPath();
    ctx.arc(cx, cy, 8, 0, 2 * Math.PI);
    ctx.fillStyle = '#222';
    ctx.fill();
    
    ctx.restore(); // Restaurar el canvas (quitar transformaciones)
    
    return new THREE.CanvasTexture(canvas);
}

// 2. CREAR EL MATERIAL Y LA MALLA DE LA MESA (¡ESTO FALTABA!)
const texturaMesa = crearTexturaMesa();

const materialLateral = new THREE.MeshStandardMaterial({ color: 0x888888 });
const materialTapaSuperior = new THREE.MeshStandardMaterial({ 
    map: texturaMesa,
    roughness: 0.8,
    metalness: 0.1
});
const materialTapaInferior = new THREE.MeshStandardMaterial({ color: 0x555555 });

const mesaGeometry = new THREE.CylinderGeometry(2, 2, 0.1, 64);
const mesa = new THREE.Mesh(mesaGeometry, [
    materialLateral,
    materialTapaSuperior,
    materialTapaInferior
]);
mesa.position.y = 0;

// 3. ROTAR LA MESA 90° para alinear las marcas con las flechas
mesa.rotation.y =-Math.PI / 2;

scene.add(mesa);

        // ============================================================
        // FLECHAS (3 CILINDROS ALARGADOS)
        // ============================================================
        const flechas = [];
        const colores = [0xff4444, 0x44ff44, 0x4444ff]; // Rojo, Verde, Azul

        for (let i = 0; i < 3; i++) {
            const flechaGroup = new THREE.Group();
            
            // Cuerpo de la flecha (cilindro)
            const cuerpoGeometry = new THREE.CylinderGeometry(0.05, 0.05, 1, 8);
            const cuerpoMaterial = new THREE.MeshStandardMaterial({ color: colores[i] });
            const cuerpo = new THREE.Mesh(cuerpoGeometry, cuerpoMaterial);
            cuerpo.rotation.z = Math.PI / 2;
            cuerpo.position.x = 0.5;
            flechaGroup.add(cuerpo);
            
            // Punta de la flecha (cono)
            const puntaGeometry = new THREE.ConeGeometry(0.1, 0.2, 8);
            const punta = new THREE.Mesh(puntaGeometry, cuerpoMaterial);
            punta.rotation.z = -Math.PI / 2;
            punta.position.x = 1.1;
            flechaGroup.add(punta);
            
            flechaGroup.position.set(0, 0.15, 0);
            flechaGroup.rotation.y = [30, 330, 180][i] * Math.PI / 180;
            
            scene.add(flechaGroup);
            flechas.push(flechaGroup);
        }

        // ============================================================
        // BURBUJA (ESFERA)
        // ============================================================
        const burbujaGeometry = new THREE.SphereGeometry(0.15, 32, 32);
        const burbujaMaterial = new THREE.MeshStandardMaterial({ color: 0x00ff00 });
        const burbuja = new THREE.Mesh(burbujaGeometry, burbujaMaterial);
        burbuja.position.set(0, 0.3, 0);
        scene.add(burbuja);

        // ============================================================
        // CONFIGURACIÓN DE VR
        // ============================================================
        document.body.appendChild(VRButton.createButton(renderer));

        // Controladores VR
        const controllerModelFactory = new XRControllerModelFactory();

        const controller1 = renderer.xr.getController(0);
        scene.add(controller1);
        const controllerGrip1 = renderer.xr.getControllerGrip(0);
        controllerGrip1.add(controllerModelFactory.createControllerModel(controllerGrip1));
        scene.add(controllerGrip1);

        const controller2 = renderer.xr.getController(1);
        scene.add(controller2);
        const controllerGrip2 = renderer.xr.getControllerGrip(1);
        controllerGrip2.add(controllerModelFactory.createControllerModel(controllerGrip2));
        scene.add(controllerGrip2);
// ============================================================
// LÓGICA DE FUERZAS
// ============================================================
const estado = {
    angulo1: 30, masa1: 100,
    angulo2: 330, masa2: 100,
    angulo3: 180, masa3: 173
};

function actualizarFlechas() {
    // Actualizar rotación de cada flecha según su ángulo
    flechas[0].rotation.y = (estado.angulo1-90) * Math.PI / 180;
    flechas[1].rotation.y = (estado.angulo2-90) * Math.PI / 180;
    flechas[2].rotation.y = (estado.angulo3-90) * Math.PI / 180;
    
    // Actualizar longitud según la masa (escala)
    const escalaMax = 1.5;
    const escalaMin = 0.2;
    
    for (let i = 0; i < 3; i++) {
        const masa = [estado.masa1, estado.masa2, estado.masa3][i];
        const escala = escalaMin + (masa / 500) * (escalaMax - escalaMin);
        flechas[i].scale.set(escala, 1, 1);
    }
    
    // Calcular resultante (suma de vectores)
    const v1 = vectorDeFuerza(estado.angulo1, estado.masa1);
    const v2 = vectorDeFuerza(estado.angulo2, estado.masa2);
    const v3 = vectorDeFuerza(estado.angulo3, estado.masa3);
    const resultante = {
        x: v1.x + v2.x + v3.x,
        z: v1.z + v2.z + v3.z
    };
    const magnitud = Math.sqrt(resultante.x * resultante.x + resultante.z * resultante.z);
    
    // Mover la burbuja según la resultante
    const desplazamientoMax = 1.5;
    burbuja.position.x = resultante.x * desplazamientoMax;
    burbuja.position.z = resultante.z * desplazamientoMax;
    
    // Cambiar color de la burbuja según el equilibrio
    if (magnitud < 0.1) {
        burbuja.material.color.setHex(0x00ff00); // Verde = equilibrio
        document.getElementById('estado-texto').textContent = '✅ Equilibrio';
        document.getElementById('estado').className = 'equilibrio';
    } else if (magnitud < 0.5) {
        burbuja.material.color.setHex(0xffaa00); // Naranja = casi
        document.getElementById('estado-texto').textContent = '⚠️ Casi equilibrio';
        document.getElementById('estado').className = '';
    } else {
        burbuja.material.color.setHex(0xff0000); // Rojo = desequilibrio
        document.getElementById('estado-texto').textContent = '❌ Desequilibrio';
        document.getElementById('estado').className = 'desequilibrio';
    }
}

function vectorDeFuerza(angulo, masa) {
    // Normalizar la masa (0-500) a un valor entre 0 y 1
    const magnitud = masa / 500;
    const rad = angulo * Math.PI / 180;
    return {
        x: magnitud * Math.cos(rad),
        z: magnitud * Math.sin(rad)
    };
}

// ============================================================
// CONECTAR SLIDERS CON LA LÓGICA
// ============================================================
function configurarSlider(idSlider, idValor, propiedad, unidad) {
    const slider = document.getElementById(idSlider);
    const valor = document.getElementById(idValor);
    
    slider.addEventListener('input', (e) => {
        const val = parseFloat(e.target.value);
        estado[propiedad] = val;
        valor.textContent = val + unidad;
        actualizarFlechas();
    });
}

configurarSlider('angulo1', 'angulo1-valor', 'angulo1', '°');
configurarSlider('masa1', 'masa1-valor', 'masa1', 'g');
configurarSlider('angulo2', 'angulo2-valor', 'angulo2', '°');
configurarSlider('masa2', 'masa2-valor', 'masa2', 'g');
configurarSlider('angulo3', 'angulo3-valor', 'angulo3', '°');
configurarSlider('masa3', 'masa3-valor', 'masa3', 'g');

// Inicializar
actualizarFlechas();
        // ============================================================
        // ANIMACIÓN
        // ============================================================
        function animate() {
            renderer.setAnimationLoop(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        animate();

        // ============================================================
        // RESIZE
        // ============================================================
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
